name: Talkship Android CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Unit Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Mock Google Services for CI
        run: |
          mkdir -p app
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"517041180581","project_id":"talkship-557b2","storage_bucket":"talkship-557b2.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:517041180581:android:df7191a03539adda","android_client_info":{"package_name":"com.artifee.talkship"}},"oauth_client":[{"client_id":"517041180581-7mgiojpibfk3prela4f32untatdmvatj.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyPlaceholderKey"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue -Pandroid.aapt2FromMavenOverride=

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'

  build-debug-apk:
    name: Build Debug Verification APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Mock Google Services for CI
        run: |
          mkdir -p app
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"517041180581","project_id":"talkship-557b2","storage_bucket":"talkship-557b2.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:517041180581:android:df7191a03539adda","android_client_info":{"package_name":"com.artifee.talkship"}},"oauth_client":[{"client_id":"517041180581-7mgiojpibfk3prela4f32untatdmvatj.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyPlaceholderKey"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug -Pandroid.aapt2FromMavenOverride=

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: talkship-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
