name: Talkship Android CD (Play Store Release)

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'

jobs:
  build-and-deploy-play-store:
    name: Build AAB & Deploy to Google Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 --decode > app/release.jks
            echo "Keystore decoded successfully."
          else
            echo "WARNING: SIGNING_KEY_BASE64 secret is not configured!"
          fi

      - name: Build Release Android App Bundle (.aab)
        env:
          KEYSTORE_FILE_PATH: "release.jks"
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Save Service Account Key File
        if: env.PLAY_CONSOLE_JSON_KEY != ''
        env:
          PLAY_CONSOLE_JSON_KEY: ${{ secrets.PLAY_CONSOLE_JSON_KEY }}
        run: |
          echo "$PLAY_CONSOLE_JSON_KEY" > play_service_account.json

      - name: Determine Target Track
        id: track
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TRACK=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "TRACK=production" >> $GITHUB_OUTPUT
          else
            echo "TRACK=internal" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Google Play Console
        if: env.PLAY_CONSOLE_JSON_KEY != ''
        env:
          PLAY_CONSOLE_JSON_KEY: ${{ secrets.PLAY_CONSOLE_JSON_KEY }}
        uses: rws/google-play-deploy@v1
        with:
          serviceAccountJson: play_service_account.json
          packageName: com.artifee.talkship
          aabFile: app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.track.outputs.TRACK }}
          status: 'completed'

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: talkship-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
